name: Daily Fanqie Rank Scraper

concurrency:
  group: fanqie-rank-writes-deploy
  cancel-in-progress: false

on:
  schedule:
    # 每天 UTC 00:17（北京时间 08:17）计划运行，避开整点
    - cron: '17 0 * * *'
  workflow_dispatch: # 允许手动在界面上点击 Run workflow

jobs:
  scrape-and-commit:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      pages_artifact: ${{ steps.pages_artifact.outputs.name }}

    steps:
    - name: Checkout Deploy Branch
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: deploy
        fetch-depth: 0

    - name: Sync Latest Deploy
      run: git pull --ff-only origin deploy

    - name: Check if today's data exists
      id: check_data
      run: |
        TODAY=$(date -u +"%Y%m%d")
        FILE="data/fanqie_female_new_ranks_${TODAY}.json"
        if [ -f "$FILE" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ 今日数据已存在: $FILE，跳过爬取"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "📭 今日数据不存在，将执行爬取"
        fi

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ steps.check_data.outputs.exists }}" = "false" ]; then
          playwright install --with-deps chromium
        fi

    - name: Run Scraper
      if: steps.check_data.outputs.exists == 'false'
      run: python scrape_fanqie_ranks.py
      env:
        GITHUB_ACTIONS: true

    - name: Build Latest Data with AI Summary
      run: pip install openai && python scripts/build_latest.py
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Sync Latest Deploy Before Commit
      run: git pull --rebase --autostash origin deploy

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "[Auto] Update Fanqie daily ranks"
        file_pattern: data api
        branch: deploy

    # A full workflow rerun uploads a new artifact, while a deploy-only rerun reuses this output.
    - name: Set Pages artifact name
      id: pages_artifact
      run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        name: ${{ steps.pages_artifact.outputs.name }}
        path: '.'

  deploy-pages:
    needs: scrape-and-commit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v6
      with:
        enablement: true

    - name: Deploy to GitHub Pages
      id: deployment
      continue-on-error: true
      uses: actions/deploy-pages@v5
      with:
        artifact_name: ${{ needs.scrape-and-commit.outputs.pages_artifact }}

    # The artifact lookup can briefly return no results after a successful upload.
    - name: Wait before retrying Pages deployment
      if: steps.deployment.outcome == 'failure'
      run: sleep 30

    - name: Retry GitHub Pages deployment
      if: steps.deployment.outcome == 'failure'
      id: deployment_retry
      uses: actions/deploy-pages@v5
      with:
        artifact_name: ${{ needs.scrape-and-commit.outputs.pages_artifact }}
